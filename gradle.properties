pluginGroup=com.efpt.rider
pluginName=EF Core Power Tools for Rider
pluginVersion=0.1.0

# Path to a local Rider installation to build against (avoids downloading the Rider SDK).
# Leave empty to auto-detect %LOCALAPPDATA%/Programs/Rider (or the RIDER_PATH env var); otherwise riderVersion is downloaded.
riderPath=
riderVersion=2026.3

# Path to the EF Core Power Tools repository; the prebuilt .NET tools (efreveng / efpt zips,
# T4 templates, DacFX) are copied from <efptRepo>/src/GUI/lib at build time.
efptRepo=../../EFCorePowerTools

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g
